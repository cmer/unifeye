<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantage prototype (simulated)</title>
<style>
:root{--r:8px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=light]{--bg:#fff;--fg:#09090b;--mut:#f4f4f5;--mfg:#71717a;--bd:#e4e4e7;--pri:#18181b;--prifg:#fafafa;--side:#fafafa;--acc:#f4f4f5;--ring:#a1a1aa;--bad:#dc2626;--warn:#a16207;color-scheme:light}
:root[data-theme=dark]{--bg:#09090b;--fg:#fafafa;--mut:#27272a;--mfg:#a1a1aa;--bd:#27272a;--pri:#fafafa;--prifg:#18181b;--side:#111113;--acc:#27272a;--ring:#71717a;--bad:#f87171;--warn:#facc15;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
:disabled{opacity:.5;cursor:not-allowed}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
.vh{position:absolute;opacity:0;pointer-events:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--acc)}
.btn.pri{background:var(--pri);color:var(--prifg);border-color:var(--pri)}.btn.pri:hover{opacity:.9}
.btn.bad{color:var(--bad)}
.btn.sm{height:28px;padding:0 9px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg);flex:none;position:relative}
.ib:hover{background:var(--acc)}
.ghost{border-color:transparent;background:none}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select{height:34px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);padding:0 10px;font-size:13px;min-width:0}
input[type=checkbox]{accent-color:var(--pri);width:16px;height:16px;margin:0}
input.sw{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--bd);position:relative;transition:.15s;cursor:pointer;vertical-align:middle}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px #0005;transition:.15s}
input.sw:checked{background:var(--pri)}input.sw:checked::after{left:18px}
.seg{display:inline-flex;background:var(--mut);border-radius:var(--r);padding:3px;gap:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:13px;color:var(--mfg);font-weight:500}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0003}
.tog{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:99px;font-size:12.5px;cursor:pointer;color:var(--mfg);margin:2px;position:relative}
.tog:hover{color:var(--fg)}
.tog.on{background:var(--pri);color:var(--prifg);border-color:var(--pri)}
.tog:has(:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
.badge{border:1px solid var(--bd);border-radius:99px;padding:1px 8px;font-size:11.5px;color:var(--mfg);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none;display:inline-block}.dot.off{background:#ef4444}.dot.miss{background:#71717a}

/* sidebar */
.sb{width:256px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.sb.shut{display:none}
.sbh{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 14px}
.lg{width:26px;height:26px;border-radius:7px;background:var(--pri);color:var(--prifg);display:grid;place-items:center;font-weight:700;font-size:13px}
.sbs{flex:1;overflow:auto;padding:0 8px}
.gl{font-size:12px;color:var(--mfg);font-weight:500;padding:14px 8px 6px}
.si{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:6px;text-align:left;font-size:13.5px}
.si:hover,.si.on{background:var(--acc)}.si.on{font-weight:500}
.si>span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si small{color:var(--mfg);font-size:12px}
.si .star{color:#eab308;display:flex;flex:none}
.sbf{border-top:1px solid var(--bd);padding:4px 10px 10px;display:grid;gap:6px}
.sbf .gl{padding:8px 0 0}
.me{display:flex;align-items:center;gap:8px;padding-top:6px}
.av{width:30px;height:30px;border-radius:50%;background:var(--mut);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.me .n{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.25}.me small{display:block;color:var(--mfg);font-weight:400;font-size:12px}

/* pane */
.pane{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.alert{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bd);font-size:13px;background:var(--mut);flex:none}
.alert.bad{color:var(--bad)}
.wd{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.wg{display:grid;gap:2px;grid-template-columns:repeat(3,minmax(0,1fr))}
.wg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.wg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;display:block;width:100%;color:#fff;text-align:left}
.tile[data-a]:hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px #fff}
.tile:focus-visible{outline-offset:-3px;outline-color:#fff}
.feed{position:absolute;inset:0}
.scene{width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;background:#040714;pointer-events:none}
.grain{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0001 2px 3px);pointer-events:none}
.walker{animation:walk 18s linear infinite;animation-play-state:paused}
.tile.on .walker,.stage .walker{animation-play-state:running}
.stage.paused .walker{animation-play-state:paused}
@keyframes walk{from{transform:translateX(-20px)}to{transform:translateX(340px)}}
@media(prefers-reduced-motion:reduce){.walker{animation:none}}
.nm{position:absolute;left:10px;top:10px;background:#000a;color:#fff;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:center;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden}
.offm{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#18181b;color:#a1a1aa;padding:16px;font-size:13px}
.offm b{display:block;color:#fafafa;font-weight:500;margin-bottom:2px}
.offm .btn{margin-top:12px}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--bd);box-shadow:0 8px 24px #0006;backdrop-filter:blur(12px);max-width:calc(100% - 24px);overflow-x:auto;z-index:6}
.dv{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--mfg);white-space:nowrap;font-weight:500;flex:none}
.dv:hover{color:var(--fg)}.dv.on{background:var(--pri);color:var(--prifg)}
.sep{width:1px;height:20px;background:var(--bd);margin:0 4px;flex:none}
.ib.has::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#3b82f6}
.fpill{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);box-shadow:0 8px 24px #0006;font-size:13px;font-weight:500;white-space:nowrap;z-index:5;max-width:calc(100% - 24px)}
.fpill span{color:var(--mfg);font-weight:400}
.fpill .btn{border-radius:99px}
.pop{position:absolute;z-index:8;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 32px #0008;padding:12px;width:min(300px,calc(100% - 24px))}
.pop .gl{padding:12px 2px 6px}
.pop input:not([type=checkbox]),.pop select{width:100%}
.fpop{left:50%;bottom:70px;transform:translateX(-50%);max-height:calc(100% - 90px);overflow:auto}
.jpop{right:14px;top:58px;display:grid;gap:8px}
.ck{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;font-size:13.5px;cursor:pointer}.ck:hover{background:var(--acc)}.ck small{margin-left:auto;color:var(--mfg)}

/* player */
.vw{flex:1;position:relative;background:#000;color:#fff;min-height:0;overflow:hidden}
.stage{position:absolute;inset:0}
.vtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:14px 16px 40px;background:linear-gradient(#000b,#0000);transition:opacity .3s}
.vtop b{font-size:15px;font-weight:600}
.vbot{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 14px;background:linear-gradient(#0000,#000d);transition:opacity .3s}
.vw.idle .vtop,.vw.idle .vbot{opacity:0}
.w{color:#fff!important;border-color:#fff4!important;background:#0000!important}.w:hover{background:#fff2!important}
.ghost.w{border-color:transparent!important}
select.w option{color:#000}
.vst{font-size:12.5px;color:#d4d4d8;display:flex;align-items:center;gap:6px}
.tl{position:relative;height:30px;cursor:pointer;touch-action:none;user-select:none}
.trk{position:absolute;left:0;right:0;bottom:8px;height:5px;border-radius:99px;background:#fff3;overflow:hidden}
.rng{position:absolute;top:0;bottom:0;background:#fffc;min-width:1px}
.mk{position:absolute;bottom:17px;width:6px;height:6px;border-radius:50%;margin-left:-3px}
.ph{position:absolute;bottom:3px;width:15px;height:15px;border-radius:50%;background:#fff;margin-left:-7.5px;box-shadow:0 0 0 4px #fff4;pointer-events:none}
.hrs{display:flex;justify-content:space-between;font-size:11.5px;color:#a1a1aa;margin-top:2px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ctl svg.i{width:20px;height:20px}
.time{font-size:16px;font-weight:600;margin-left:8px;font-variant-numeric:tabular-nums}.time small{font-size:12.5px;font-weight:400;color:#d4d4d8;margin-left:8px}
.bbox{position:absolute;border:2px solid;border-radius:4px;font-size:11px;font-weight:600;pointer-events:none}
.bbox span{position:absolute;left:-2px;top:-19px;padding:1px 6px;color:#000;border-radius:4px 4px 0 0;white-space:nowrap}
.hovtip{position:fixed;z-index:50;pointer-events:none;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:4px;width:140px;box-shadow:0 8px 24px #0008;font-size:12px;text-align:center}
.hovtip .mini{position:relative;aspect-ratio:16/9;border-radius:5px;overflow:hidden;margin-bottom:3px;background:#000}

/* pages */
.pg{width:100%;max-width:1120px;margin:0 auto;padding:18px 24px 90px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;min-height:34px}
h1{font-size:20px;font-weight:600;margin:0}
.sub,.note{color:var(--mfg);font-size:13px}.note{margin:6px 0}.note.w{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cd{border:1px solid var(--bd);border-radius:10px;overflow:hidden;text-align:left;background:var(--bg);display:block;width:100%}
.cd:hover{border-color:var(--ring)}
.cd .th{position:relative;aspect-ratio:16/9;background:#000}
.cd .m{padding:8px 12px 10px;display:grid}.cd b{font-weight:500}.cd .m span{color:var(--mfg);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd select{max-width:180px}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--mut);border-radius:var(--r);padding:3px;gap:2px;margin-bottom:16px}
.tabs button{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--mfg);font-weight:500}
.tabs .on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0003}
.card{border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.row>.k{width:120px;color:var(--mfg);flex:none;font-size:13px}
.cols2{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.cols2>.card{padding:6px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--bd);vertical-align:middle}
tr:first-child>*{border-top:0}
th{font-weight:500;color:var(--mfg);font-size:12.5px;white-space:nowrap}
td.c,th.c{text-align:center}
td small,th small{display:block;color:var(--mfg);font-weight:400}
.ord{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:6px}.ord .n{flex:1}
.empty{margin:auto;max-width:400px;text-align:center;color:var(--mfg);padding:60px 16px}
.empty h3{color:var(--fg);margin:12px 0 4px;font-size:16px;font-weight:600}
.empty svg.i{width:28px;height:28px}
.empty .btn{margin-top:14px}
.demo{position:fixed;bottom:16px;left:16px;z-index:30;display:flex;align-items:center;gap:8px;padding:3px 4px 3px 12px;border-radius:99px;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);font-size:12px;color:var(--mfg);box-shadow:0 4px 14px #0004;white-space:nowrap}
.demo select{height:26px;border-radius:99px;font-size:12px;border:0;background:var(--mut);color:var(--fg)}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:6px;z-index:100}
.toast{background:var(--bg);border:1px solid var(--bd);padding:10px 14px;border-radius:var(--r);box-shadow:0 8px 24px #0006;max-width:340px;font-size:13px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:80;padding:16px}
.modal .card{width:min(420px,100%);background:var(--bg);margin:0}
.bar{height:6px;border-radius:3px;background:var(--mut);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}
@media(max-width:760px){
 .sb{position:fixed;z-index:40;top:0;bottom:0;left:0;box-shadow:0 0 0 100vmax #0008}
 .demo{display:none}
 .wg,.wg.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cols2{grid-template-columns:1fr}
 .pg{padding:14px 14px 90px}
 .time small{display:none}
}
@media(max-width:480px){.wg,.wg.c2,.wg.c4{grid-template-columns:1fr}}
</style>

function gaps(c,a,b){const g=[[-Infinity,T0-RET],[Date.now(),Infinity]];if(!c.online)g.push([T0-3*36e5,Infinity]);
 for(let d=Math.floor(a/DAY)-1;d<=Math.floor(b/DAY);d++){const r=rng(c.n*7919+d*13),k=Math.floor(r()*3);for(let i=0;i<k;i++){const s=d*DAY+r()*DAY;g.push([s,s+(4+r()*36)*6e4])}}

const inRec=(c,t)=>recRanges(c,t,t+1).length>0;
const nextRec=(c,t)=>{const r=recRanges(c,t,t+2*DAY)[0];return r?r[0]:null};

function camEvents(c){if(_ev[c.id])return _ev[c.id];const out=[],types=['person'];if(c.tags.includes('outdoors'))types.push('vehicle','animal');if(c.tags.includes('deliveries')||c.tags.includes('entrance'))types.push('package');

  for(let i=0;i<n;i++){const t=Math.floor(d*DAY+r()*DAY),type=r()<.45?'motion':types[Math.floor(r()*types.length)],dur=5+Math.floor(r()*40),x=10+r()*55,y=30+r()*25;

/* viewport-aware loading with a bounded number of simultaneous streams; the rest hold a still image */
const CAP=9;let io;
function watchTiles(){io?.disconnect();const on=new Set,wait=new Set;

  for(const el of wait){if(on.size>=CAP)break;wait.delete(el);on.add(el);el.classList.add('on')}},{threshold:.2});
 $$('.tile[data-a]:not([data-off])').forEach(t=>io.observe(t))}

  ${DB.cams.map(c=>`<tr><td style="white-space:nowrap"><i class="dot ${c.online?'':'off'}" style="margin-right:8px"></i>${esc(c.name)}</td>${subs.map(([k,n])=>`<td class="c"><input type="checkbox" data-c="grant" data-k="${k}" data-id="${c.id}" ${(DB.grants[k]||[]).includes(c.id)?'checked':''} aria-label="${esc(n)}: ${esc(c.name)}"></td>`).join('')}</tr>`).join('')}</table></div>`},
 tags:()=>`<div class="row" style="margin-top:0"><input type="text" id="tname" placeholder="New tag" aria-label="New tag"><button class="btn" data-a="tadd">${ic('plus')}Add tag</button><span class="sub">Tags live in Vantage. The recorder is never changed.</span></div>
  <div class="tw"><table><tr><th>Camera</th><th>Tags</th></tr>${DB.cams.map(c=>`<tr><td style="white-space:nowrap">${esc(c.name)}</td><td>${DB.tags.map(t=>`<label class="tog ${c.tags.includes(t)?'on':''}"><input type="checkbox" class="vh" data-c="ctag" data-id="${c.id}" data-t="${esc(t)}" ${c.tags.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</td></tr>`).join('')}</table></div>
  <div class="card" style="margin-top:14px"><h3>Rename or remove</h3>${DB.tags.map(t=>`<div class="row"><input type="text" data-c="tren" data-t="${esc(t)}" value="${esc(t)}" style="width:180px" aria-label="Tag name"><span class="sub">${DB.cams.filter(c=>c.tags.includes(t)).length} cameras</span><span class="sp"></span><button class="btn sm bad" data-a="tdel" data-t="${esc(t)}">Remove</button></div>`).join('')}</div>`,
 preview:()=>{const st=DB.users.filter(u=>u.role==='staff'&&u.active),s=st.find(u=>u.id===S.pvPick)||st[0];if(!s)return'<p class="note">There are no active staff to look at.</p>';const l=landing(s.id);
  return`<div class="card"><h3>See Vantage as a staff member</h3><p class="note">Check exactly what someone sees. You stay signed in as yourself, nothing can be changed while looking, it ends after 15 minutes, and it is recorded in History. Their account is not touched.</p>
  <div class="row"><span class="k">Staff member</span><select data-c="pvPick">${st.map(u=>`<option value="${u.id}" ${u.id===s.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><button class="btn pri" data-a="pvStart" data-id="${s.id}">${ic('eye')}Start</button></div>
  <div class="row"><span class="k">Starts on</span><span>${esc(l.id?view(l.id).name:'Camera wall')}</span><span class="sub">${esc(l.why)}</span></div>
  <div class="row" style="align-items:flex-start"><span class="k">Cameras</span><div style="flex:1">${authCams(s.id).map(c=>`<span class="badge">${esc(c.name)}</span>`).join(' ')||'<span class="sub">None</span>'}</div></div>
  <div class="row" style="align-items:flex-start;margin-bottom:0"><span class="k">Views</span><div style="flex:1">${accViews(s.id).map(v=>`<span class="badge">${esc(v.name)}</span>`).join(' ')||'<span class="sub">None</span>'}</div></div></div>`},
 audit:()=>`<div class="tw"><table><tr><th>When</th><th>Who</th><th>Seeing as</th><th>What</th><th>Details</th></tr>${DB.audit.map(a=>`<tr><td style="white-space:nowrap">${dL(a.t)}, ${tS(a.t)}</td><td>${esc(user(a.actor)?.name)}</td><td>${a.subject?esc(user(a.subject)?.name):''}</td><td>${esc(a.action)}${a.outcome==='ok'?'':' <span class="badge">blocked</span>'}</td><td>${esc(a.target)}</td></tr>`).join('')||'<tr><td colspan="5" class="sub">Nothing yet. Changes made in this demo session appear here.</td></tr>'}</table></div>`}[S.atab]()}</div></div>`}

/* ---------- save clip dialog ---------- */
function modal(){const m=S.modal;return`<div class="modal" data-a="mclose"><div class="card" role="dialog" aria-label="Save clip"><h3>Save a clip from ${esc(cam(m.cam).name)}</h3>
 ${m.state==='idle'?`<div class="row"><span class="k">Starts at</span><span>${dL(m.t)}, ${tS(m.t)}</span></div><div class="row"><span class="k">Length</span><select data-c="xlen">${[15,30,60,120,300].map(s=>`<option value="${s}" ${m.len===s?'selected':''}>${s<60?s+' seconds':s/60+(s===60?' minute':' minutes')}</option>`).join('')}</select></div>${m.err?`<p class="note w">${esc(m.err)}</p>`:''}<div class="row" style="margin-bottom:0"><span class="sp"></span><button class="btn" data-a="mclose" data-x="1">Cancel</button><button class="btn pri" data-a="xgo">Save clip</button></div>`
 :m.state==='run'?`<p class="note">Preparing your clip…</p><div class="bar"><i style="width:${m.p}%"></i></div><div class="row" style="margin-bottom:0"><span class="sp"></span><button class="btn" data-a="xcancel">Cancel</button></div>`
 :`<p class="note">Your clip is ready. The download link works only for you and expires in 10 minutes.</p><div class="row" style="margin-bottom:0"><span class="sp"></span><button class="btn" data-a="mclose" data-x="1">Close</button><button class="btn pri" data-a="xdl">${ic('dl')}Download (simulated)</button></div>`}</div></div>`}

/* ---------- actions ---------- */

const A={

  const v={id:'v'+Date.now(),name:S.tags.length?S.tags.join(' + '):'New view',type:S.tags.length?'dynamic':'static',tags:[...S.tags],cams:S.tags.length?[]:cs.map(c=>c.id),cols:getCols(),owner:u.id,priv:u.role!=='admin',share:{org:false,groups:[],users:[]}};
  DB.views.push(v);audit('Created a view',v.name);Object.assign(S,{route:'views',vtab:'views',editId:v.id,pop:null});toast(v.priv?'Saved as a private view':'View saved. Share it to let others open it.');render()},
 play(){const v=S.v;if(v.live){v.live=false;v.playing=false;v.t=Date.now()-1000}else v.playing=!v.playing;tick(true)},
 skip(d){seek(S.v.t+d.d*1000)},live(){S.v.playing=true;seek(Date.now())},seekto(d){S.v.playing=true;seek(+d.t)},
 lastrec(){const c=cam(S.v.cam),r=recRanges(c,T0-RET,Date.now()).pop();if(r){S.v.playing=true;seek(r[1]-6e4)}},
 zoom(d){S.v.zoom=d.z==='day'?'day':+d.z;S.v.w0=null;render()},
 export(){const v=S.v;if(S.nvr)return toast('Clips are unavailable while the recorder is unreachable');S.modal={cam:v.cam,t:v.live?Date.now()-6e4:v.t,len:30,state:'idle',p:0};render()},
 mclose(d,el,ev){if(ev.target!==el&&!d.x)return;clearInterval(S.modal?.iv);S.modal=null;render()},
 xgo(){const m=S.modal,c=cam(m.cam),r=recRanges(c,m.t,m.t+m.len*1000);if(r.length!==1||r[0][0]>m.t||r[0][1]<m.t+m.len*1000){m.err='Part of that time has no recording. Pick a moment that was recorded.';return render()}
  m.state='run';m.err='';m.iv=setInterval(()=>{m.p+=8;if(m.p>=100){clearInterval(m.iv);m.state='done';audit('Saved a clip',c.name)}render()},220);render()},
 xcancel(){clearInterval(S.modal.iv);S.modal=null;toast('Clip cancelled');render()},
 xdl(){toast('Simulated: the real app downloads the clip through a private, expiring link')},
 evmore(){S.ev.n+=24;render()},
 evopen(d){const c=authCams(eff()).find(x=>x.id===d.cam),e=c&&camEvents(c).find(x=>x.id===d.id);if(e)openViewer(c.id,e.t-5000)},
 vtab(d){S.vtab=d.t;render()},atab(d){S.atab=d.t;render()},vsel(d){S.editId=d.id;render()},
 vnew(){if(!mut())return;const u=user(S.actor);if(u.role!=='admin'&&!u.priv)return;const v={id:'v'+Date.now(),name:'Untitled view',type:'dynamic',tags:[],cams:[],cols:3,owner:u.id,priv:u.role!=='admin',share:{org:false,groups:[],users:[]}};DB.views.push(v);S.editId=v.id;S.vtab='views';audit('Created a view',v.name);render()},
 vtype(d){const v=edV();if(!v||v.type===d.t)return;
  if(d.t==='static'){if(!confirm('Switch to a fixed list? The cameras that match right now are kept, and the tag rule is removed.'))return;v.cams=resolve(v,S.actor).map(c=>c.id);v.tags=[]}
  else{if(!confirm('Switch to following tags? The fixed camera list is removed.'))return;v.cams=[]}
  v.type=d.t;audit('Changed a view',v.name);render()},
 vcols(d){const v=edV();if(v){v.cols=+d.n;render()}},
 vtag(d){const v=edV();if(v){v.tags=tog(v.tags,d.t,!v.tags.includes(d.t));audit('Changed a view',v.name);render()}},
 vmove(d){const v=edV();if(!v)return;const vis=resolve(v,S.actor).map(c=>c.id),i=vis.indexOf(d.id),j=i+ +d.d;if(j<0||j>=vis.length)return;const a=v.cams.indexOf(vis[i]),b=v.cams.indexOf(vis[j]);[v.cams[a],v.cams[b]]=[v.cams[b],v.cams[a]];render()},
 vrm(d){const v=edV();if(v){v.cams=v.cams.filter(x=>x!==d.id);audit('Changed a view',v.name);render()}},
 vdel(){const v=edV();if(!v||!confirm(`Delete "${v.name}"? Anyone who starts on it will start somewhere else.`))return;DB.views=DB.views.filter(x=>x!==v);const D=DB.defaults;if(D.org===v.id)D.org='';for(const o of[D.groups,D.users,D.personal])for(const k in o)if(o[k]===v.id)delete o[k];if(S.viewId===v.id)S.viewId=null;S.editId=null;audit('Deleted a view',v.name);render()},
 pvStart(d){if(!isAdmin()){audit('Tried to see as staff',d.id,'denied');return toast('Only administrators can do this')}const s=user(d.id);if(!s||s.role!=='staff'||!s.active)return toast('That person cannot be previewed');S.preview=s.id;S.pvExp=Date.now()+15*6e4;audit('Started seeing as staff',s.name);goLanding()},
 pvExit(){audit('Stopped seeing as staff',user(S.preview).name);S.preview=null;S.route='admin';S.atab='preview';render()},
 resume(){S.expired=false;goLanding()},
 gadd(){if(!mut())return;const n=$('#gname').value.trim();if(!n)return;DB.groups.push({id:'g'+Date.now(),name:n,prio:10,members:[]});audit('Added a group',n);render()},
 gdel(d){if(!mut())return;const g=group(d.id);if(!confirm(`Delete ${g.name}? Its members lose the cameras and views they had through it.`))return;DB.groups=DB.groups.filter(x=>x!==g);delete DB.grants['g:'+g.id];delete DB.defaults.groups[g.id];DB.views.forEach(v=>v.share.groups=v.share.groups.filter(x=>x!==g.id));audit('Deleted a group',g.name);render()},
 tadd(){if(!mut())return;const n=$('#tname').value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_');if(!n||DB.tags.includes(n))return toast(n?'That tag already exists':'Type a tag name first');DB.tags.push(n);audit('Added a tag',n);render()},
 tdel(d){if(!mut())return;const used=DB.views.filter(v=>v.type==='dynamic'&&v.tags.includes(d.t));if(!confirm(`Remove the tag ${d.t}?${used.length?` ${used.length} view(s) use it and will stop filtering by it.`:''}`))return;DB.tags=DB.tags.filter(t=>t!==d.t);DB.cams.forEach(c=>c.tags=c.tags.filter(t=>t!==d.t));DB.views.forEach(v=>v.tags=v.tags.filter(t=>t!==d.t));S.tags=S.tags.filter(t=>t!==d.t);audit('Removed a tag',d.t);render()}
};
const shareOk=(v,kind,id)=>kind==='g'?(v.share.org||v.share.groups.includes(id)):accViews(id).includes(v);
const Ch={
 ident(el){S.actor=el.value;S.preview=null;goLanding()},
 sim(el){if(el.value==='nvr')S.nvr=!S.nvr;if(el.value==='exp')S.expired=true;render()},
 ftag(el){S.tags=tog(S.tags,el.dataset.t,el.checked);render()},
 speed(el){S.v.speed=+el.value},
 tz(el){S.tz=el.value;if(!S.preview)LS.set('tz',S.tz);S.v&&(S.v.w0=null);render()},
 date(el){if(!el.value)return;const[y,m,d]=el.value.split('-').map(Number),p=P(S.v.t);S.v.playing=true;seek(z2u(y,m,d,+p.hour,+p.minute,+p.second))},
 time(el){if(!el.value)return;const[h,mi,s=0]=el.value.split(':').map(Number),p=P(S.v.t);S.v.playing=true;seek(z2u(+p.year,+p.month,+p.day,h,mi,s))},
 evcam(el){S.ev.cam=el.value;S.ev.n=24;render()},evrange(el){S.ev.range=+el.value;S.ev.n=24;render()},evtype(el){S.ev.type=el.value;S.ev.n=24;render()},
 xlen(el){S.modal.len=+el.value},pvPick(el){S.pvPick=el.value;render()},
 vname(el){const v=edV();if(v&&el.value.trim()){v.name=el.value.trim();audit('Renamed a view',v.name)}render()},
 vadd(el){const v=edV();if(v&&el.value&&authCams(S.actor).some(c=>c.id===el.value)){v.cams.push(el.value);audit('Changed a view',v.name)}render()},
 shOrg(el){const v=edV();if(v){v.share.org=el.checked;audit(el.checked?'Shared a view':'Stopped sharing a view',`${v.name}: all staff`)}render()},
 shG(el){const v=edV();if(v){v.share.groups=tog(v.share.groups,el.dataset.id,el.checked);audit(el.checked?'Shared a view':'Stopped sharing a view',`${v.name}: ${group(el.dataset.id).name}`)}render()},
 shU(el){const v=edV();if(v){v.share.users=tog(v.share.users,el.dataset.id,el.checked);audit(el.checked?'Shared a view':'Stopped sharing a view',`${v.name}: ${user(el.dataset.id).name}`)}render()},
 defOrg(el){if(mut()){const v=view(el.value);if(v&&!v.share.org)toast('Tip: share this view with all staff, or only people who can already open it will start on it');DB.defaults.org=el.value;audit('Set the starting view',`Everyone: ${v?.name||'none'}`)}render()},
 defG(el){if(mut()){const v=view(el.value),g=group(el.dataset.id);if(v&&!shareOk(v,'g',g.id))toast(`Share "${v.name}" with ${g.name} first`);else{el.value?DB.defaults.groups[g.id]=el.value:delete DB.defaults.groups[g.id];audit('Set the starting view',`${g.name}: ${v?.name||'none'}`)}}render()},
 defU(el){if(mut()){const v=view(el.value),u=user(el.dataset.id);if(v&&!shareOk(v,'u',u.id))toast(`${u.name} cannot open "${v.name}". Share it with them first.`);else{el.value?DB.defaults.users[u.id]=el.value:delete DB.defaults.users[u.id];audit('Set the starting view',`${u.name}: ${v?.name||'none'}`)}}render()},
 defMe(el){if(mut()&&user(S.actor).priv){el.value?DB.defaults.personal[S.actor]=el.value:delete DB.defaults.personal[S.actor]}render()},
 gprio(el){if(mut())group(el.dataset.id).prio=+el.value||0;render()},
 gname(el){if(mut()&&el.value.trim())group(el.dataset.id).name=el.value.trim();render()},
 gmem(el){if(mut()){const g=group(el.dataset.g);g.members=tog(g.members,el.dataset.id,el.checked);audit(el.checked?'Added to a group':'Removed from a group',`${user(el.dataset.id).name}: ${g.name}`)}render()},
 urole(el){if(mut()&&el.dataset.id!==S.actor){user(el.dataset.id).role=el.value;audit('Changed a role',`${user(el.dataset.id).name}: ${el.value}`)}render()},
 upriv(el){if(mut())user(el.dataset.id).priv=el.checked;render()},
 uact(el){if(mut()&&el.dataset.id!==S.actor){user(el.dataset.id).active=el.checked;audit(el.checked?'Turned an account on':'Turned an account off',user(el.dataset.id).name)}render()},
 grant(el){if(mut()){const k=el.dataset.k;DB.grants[k]=tog(DB.grants[k]||[],el.dataset.id,el.checked);audit(el.checked?'Gave camera access':'Removed camera access',`${k.startsWith('g:')?group(k.slice(2)).name:user(k.slice(2)).name}: ${cam(el.dataset.id).name}`)}render()},
 ctag(el){if(mut()){const c=cam(el.dataset.id);c.tags=tog(c.tags,el.dataset.t,el.checked);audit(el.checked?'Tagged a camera':'Untagged a camera',`${c.name}: ${el.dataset.t}`)}render()},
 tren(el){const o=el.dataset.t,n=el.value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_');if(mut()&&n&&n!==o&&!DB.tags.includes(n)){const rn=a=>a.map(t=>t===o?n:t);DB.tags=rn(DB.tags);DB.cams.forEach(c=>c.tags=rn(c.tags));DB.views.forEach(v=>v.tags=rn(v.tags));S.tags=rn(S.tags);audit('Renamed a tag',`${o} to ${n}`)}render()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]'),shut=S.pop&&!ev.target.closest('.pop,[data-a=pop]');if(shut)S.pop=null;
 if(el&&!el.disabled)A[el.dataset.a]?.(el.dataset,el,ev);if(shut&&$('.pop'))render()});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset?.c)Ch[el.dataset.c]?.(el)});

/* timeline: click or drag to seek, hover for a preview */
const tlT=ev=>{const r=$('#tl').getBoundingClientRect(),[a,b]=S.v._win;return a+Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width))*(b-a)};
let drag=false,tip;
document.addEventListener('pointerdown',ev=>{if(ev.target.closest?.('#tl')){drag=true;S.v.playing=true;seek(tlT(ev))}});
document.addEventListener('pointerup',()=>drag=false);
document.addEventListener('pointermove',ev=>{lastMove=Date.now();const on=S.route==='viewer'&&ev.target.closest?.('#tl');if(!on&&!drag){tip?.remove();tip=null;return}
 if(!$('#tl'))return;const t=tlT(ev),c=cam(S.v.cam),r=$('#tl').getBoundingClientRect();if(drag)seek(t);
 if(!tip){tip=document.createElement('div');tip.className='hovtip';document.body.append(tip)}
 const ok=!S.nvr&&t<Date.now()&&inRec(c,t),e=ok&&evAt(c,t);tip.innerHTML=`<div class="mini">${ok?feed(c,t)+(e?bbox(e):''):'<div class="offm" style="font-size:11px">Not recorded</div>'}</div>${tS(t)}`;
 tip.style.left=Math.min(innerWidth-148,Math.max(4,ev.clientX-70))+'px';tip.style.top=(r.top-110)+'px'});
document.addEventListener('keydown',ev=>{lastMove=Date.now();if(ev.key==='Escape'&&S.pop){S.pop=null;return render()}
 if(S.route!=='viewer'||S.modal||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;
 if(ev.key===' '){ev.preventDefault();A.play()}else if(ev.key==='ArrowLeft')seek(S.v.t-10000);else if(ev.key==='ArrowRight')seek(S.v.t+10000);else if(ev.key==='Escape'&&!document.fullscreenElement)A.back()});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>S.theme==='system'&&render());
/* simulated live updates: new activity arrives now and then on a camera the viewer may see */
setInterval(()=>{if(S.nvr||S.expired)return;const cs=authCams(eff()).filter(c=>c.online);if(!cs.length)return;const c=cs[Math.floor(Math.random()*cs.length)],t=Date.now()-8000;
 camEvents(c).push({id:'live'+t,cam:c.id,t,type:Math.random()<.5?'motion':'person',dur:6,x:20+Math.random()*40,y:35+Math.random()*15});
 if(S.route==='events'&&!document.activeElement?.matches('select'))render();else if(S.route==='viewer'&&S.v?.cam===c.id)drawTl()},20000);
goLanding();
